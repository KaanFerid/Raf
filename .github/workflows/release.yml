name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional: Manually override version (e.g., 1.6.0). Leave empty to use current version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Apply Manual Version (If Provided)
        if: "${{ github.event.inputs.version_tag != '' }}"
        run: |
          sed -i 's/__version__ = ".*"/__version__ = "${{ github.event.inputs.version_tag }}"/' src/core/version.py
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install setuptools requests PySide6
          
      - name: Build .deb package
        run: python3 scripts/build_deb.py

      - name: Extract Version & Generate Notes
        run: |
          VERSION=$(python3 -c "import sys, os; sys.path.insert(0, os.getcwd()); from src.core.version import __version__; print(__version__)")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          
          # Find the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          echo "Release notes for v$VERSION" > release_notes.txt
          echo "" >> release_notes.txt
          echo "### Changelog" >> release_notes.txt
          
          if [ -z "$PREV_TAG" ]; then
              git log --pretty=format:"* %s (%h)" >> release_notes.txt
          else
              git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> release_notes.txt
          fi
          
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The script produces a file like raf_1.5.6_all.deb
          DEB_FILE=$(ls raf_*.deb | head -n 1)
          
          # Use GitHub CLI to create a release with our custom notes
          gh release create "${{ env.VERSION }}" "$DEB_FILE" \
            --title "Release ${{ env.VERSION }}" \
            --notes-file release_notes.txt

      - name: Bump Version for Next Cycle
        run: |
          python3 scripts/bump_version.py
          git commit -m "chore: bump version for next development cycle [skip ci]"
          git push origin main

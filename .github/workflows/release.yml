name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install setuptools requests PySide6
          
      - name: Build .deb package
        run: python3 scripts/build_deb.py

      - name: Extract Version
        run: |
          VERSION=$(python3 -c "import sys, os; sys.path.insert(0, os.getcwd()); from src.core.version import __version__; print(__version__)")
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The script produces a file like raf_1.5.6_all.deb
          DEB_FILE=$(ls raf_*.deb | head -n 1)
          
          # Use GitHub CLI to create a release
          gh release create "${{ env.VERSION }}" "$DEB_FILE" \
            --title "Release ${{ env.VERSION }}" \
            --generate-notes
